<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shared Cursors</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100000;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(0,0,0,.75);
      color: white;
      font-size: 14px;
    }

    .cursor {
      position: fixed;
      z-index: 99999;
      pointer-events: none;
      left: 0;
      top: 0;
      transition: left .04s linear, top .04s linear;
    }

    .arrow {
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 15px solid var(--color);
      transform: rotate(-45deg);
      filter: drop-shadow(1px 2px 2px #000);
    }

    .name {
      position: absolute;
      left: 10px;
      top: 12px;
      background: var(--color);
      color: white;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div id="status">Connecting...</div>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ================================
   FIREBASE
================================ */

const firebaseConfig = {
  apiKey: "AIzaSyAdNB_wjlrAgC3wfIO25Hz-DtDDpvYOQcU",
  authDomain: "curster-2fee2.firebaseapp.com",
  databaseURL: "https://curster-2fee2-default-rtdb.firebaseio.com",
  projectId: "curster-2fee2",
  storageBucket: "curster-2fee2.firebasestorage.app",
  messagingSenderId: "129479890927",
  appId: "1:129479890927:web:ca86b8b7e9aa08b3ab881a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* ================================
   THIS USER
================================ */

const id = crypto.randomUUID();

const colors = [
  "#ff3b30",
  "#007aff",
  "#34c759",
  "#af52de",
  "#ff9500",
  "#00c7be",
  "#ff2d55",
  "#5856d6"
];

const color =
  colors[Math.floor(Math.random() * colors.length)];

const name =
  "User " + Math.floor(Math.random() * 10000);

const myRef = ref(db, "cursors/" + id);


/* ================================
   CONNECTION STATUS
================================ */

const connectedRef = ref(db, ".info/connected");

onValue(connectedRef, snapshot => {

  const status = document.getElementById("status");

  if (snapshot.val() === true) {
    status.textContent = "🟢 Connected";
  } else {
    status.textContent = "🔴 Disconnected";
  }

});


/* ================================
   DELETE WHEN LEAVING
================================ */

onDisconnect(myRef).remove();


/* ================================
   SEND CURSOR
================================ */

let lastUpdate = 0;

document.addEventListener("mousemove", event => {

  const now = performance.now();

  if (now - lastUpdate < 30) return;

  lastUpdate = now;

  set(myRef, {
    x: event.clientX,
    y: event.clientY,
    name: name,
    color: color
  });

});


/* ================================
   RECEIVE EVERYONE
================================ */

const allCursors = ref(db, "cursors");

const elements = new Map();

onValue(allCursors, snapshot => {

  const users = snapshot.val() || {};

  for (const userId in users) {

    if (userId === id) continue;

    const user = users[userId];

    let cursor = elements.get(userId);

    if (!cursor) {

      cursor = document.createElement("div");

      cursor.className = "cursor";

      cursor.innerHTML = `
        <div class="arrow"></div>
        <div class="name"></div>
      `;

      document.body.appendChild(cursor);

      elements.set(userId, cursor);
    }

    cursor.style.left = user.x + "px";
    cursor.style.top = user.y + "px";

    cursor.style.setProperty(
      "--color",
      user.color
    );

    cursor.querySelector(".name").textContent =
      user.name;
  }


  /* Remove people who left */

  for (const [userId, element] of elements) {

    if (!users[userId]) {

      element.remove();
      elements.delete(userId);

    }

  }

});

</script>

</body>
</html>
