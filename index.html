<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bulletin Board</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #d8c7a2;
  color: #222;
}

body {
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.22), transparent 28%),
    radial-gradient(circle at 80% 80%, rgba(90,55,20,.12), transparent 32%),
    repeating-linear-gradient(0deg, rgba(80,50,20,.035) 0 2px, transparent 2px 6px),
    #cdb88d;
}

#board {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    linear-gradient(rgba(125,82,35,.07), rgba(125,82,35,.07)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 3px, transparent 3px 8px),
    #b88958;
  box-shadow: inset 0 0 70px rgba(55,30,10,.35);
}

#board::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 0 12px rgba(77,43,18,.5), inset 0 0 35px rgba(40,20,5,.45);
}

#topbar {
  position: fixed;
  top: 18px;
  left: 18px;
  right: 18px;
  z-index: 100000;
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  pointer-events: none;
}

#topbar > * { pointer-events: auto; }

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 14px;
  font-weight: bold;
  cursor: pointer;
}

#newNote {
  background: #ffdf57;
  color: #382900;
  box-shadow: 0 3px 10px rgba(0,0,0,.25);
}

#status {
  padding: 9px 12px;
  border-radius: 9px;
  background: rgba(30,20,12,.82);
  color: white;
  font-size: 13px;
  box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

#nameBar {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px;
  border-radius: 10px;
  background: rgba(30,20,12,.88);
  box-shadow: 0 3px 10px rgba(0,0,0,.22);
}

#nameInput {
  width: clamp(100px, 14vw, 170px);
  padding: 7px 9px;
  border: 0;
  outline: none;
  border-radius: 7px;
  background: #fff;
  color: #222;
  font: inherit;
}

#saveName {
  background: #34c759;
  color: white;
}

#empty {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  color: rgba(45,25,10,.55);
  text-align: center;
  pointer-events: none;
  font-size: clamp(18px, 3vw, 30px);
  font-weight: bold;
}

.note {
  position: fixed;
  width: 190px;
  min-height: 155px;
  padding: 18px 15px 15px;
  z-index: 500;
  user-select: none;
  touch-action: none;
  cursor: grab;
  color: #302a18;
  box-shadow: 0 8px 18px rgba(35,20,5,.32);
  transform: rotate(var(--rotation));
  transition: box-shadow .12s;
}

.note:active {
  cursor: grabbing;
  box-shadow: 0 12px 25px rgba(35,20,5,.42);
  z-index: 9000;
}

.note::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -5px;
  transform: translateX(-50%);
  width: 54px;
  height: 15px;
  background: rgba(210,190,150,.65);
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}

.note.yellow { background: #fff27a; }
.note.blue { background: #9fe5ff; }
.note.green { background: #b7efad; }
.note.pink { background: #ffb5c8; }
.note.orange { background: #ffc477; }

.noteText {
  width: 100%;
  min-height: 92px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 17px;
  line-height: 1.25;
}

.noteName {
  margin-top: 12px;
  padding-top: 7px;
  border-top: 1px dashed rgba(50,40,20,.35);
  font-size: 12px;
  font-weight: bold;
  opacity: .7;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#noteModal {
  position: fixed;
  inset: 0;
  z-index: 200000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(25,15,5,.62);
  padding: 20px;
}

#notePanel {
  width: min(460px, 94vw);
  padding: 20px;
  border-radius: 16px;
  background: #f5ead0;
  box-shadow: 0 18px 55px rgba(0,0,0,.45);
}

#notePanel h2 {
  margin: 0 0 14px;
}

#noteTextInput {
  width: 100%;
  height: 170px;
  resize: vertical;
  padding: 12px;
  border: 2px solid #d0bc92;
  border-radius: 10px;
  outline: none;
  font: 17px/1.3 Arial, sans-serif;
  background: #fffdf6;
}

#noteControls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 12px;
}

.colorChoice {
  width: 30px;
  height: 30px;
  padding: 0;
  border: 2px solid rgba(0,0,0,.18);
}

#yellow { background:#fff27a; }
#blue { background:#9fe5ff; }
#green { background:#b7efad; }
#pink { background:#ffb5c8; }
#orange { background:#ffc477; }

#postNote {
  margin-left: auto;
  background: #4caf50;
  color: white;
}

#cancelNote {
  background: #d8d0c0;
  color: #3b3327;
}

@media (max-width: 650px) {
  #topbar { top: 8px; left: 8px; right: 8px; gap: 5px; }
  button { padding: 8px 10px; }
  #status { font-size: 11px; }
  #nameBar { order: 10; flex-basis: 100%; max-width: 280px; }
  .note { width: 165px; min-height: 140px; }
  .noteText { font-size: 15px; }
}
</style>
</head>
<body>

<div id="board"></div>

<div id="topbar">
  <button id="newNote">📌 New Note</button>
  <div id="nameBar">
    <span>👤</span>
    <input id="nameInput" maxlength="24" autocomplete="off" placeholder="Your name">
    <button id="saveName" type="button">Set Name</button>
  </div>
  <div id="status">Connecting...</div>
</div>

<div id="empty">📌 Stick a note on the board!</div>

<div id="noteModal">
  <div id="notePanel">
    <h2>📌 Post a Note</h2>
    <textarea id="noteTextInput" maxlength="500" placeholder="Write your note..."></textarea>
    <div id="noteControls">
      <span>Color:</span>
      <button class="colorChoice" id="yellow" data-color="yellow" title="Yellow"></button>
      <button class="colorChoice" id="blue" data-color="blue" title="Blue"></button>
      <button class="colorChoice" id="green" data-color="green" title="Green"></button>
      <button class="colorChoice" id="pink" data-color="pink" title="Pink"></button>
      <button class="colorChoice" id="orange" data-color="orange" title="Orange"></button>
      <button id="cancelNote">Cancel</button>
      <button id="postNote">Stick Note</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase, ref, set, push, onValue, remove
} from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey:
    "AIzaSyAdNB_wjlrAgC3wfIO25Hz-DtDDpvYOQcU",

  authDomain:
    "curster-2fee2.firebaseapp.com",

  databaseURL:
    "https://curster-2fee2-default-rtdb.firebaseio.com",

  projectId:
    "curster-2fee2",

  storageBucket:
    "curster-2fee2.firebasestorage.app",

  messagingSenderId:
    "129479890927",

  appId:
    "1:129479890927:web:ca86b8b7e9aa08b3ab881a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const sessionId =
  sessionStorage.getItem("bulletinBoardSessionId") ||
  (crypto.randomUUID ? crypto.randomUUID() :
    "guest-" + Date.now() + "-" + Math.random().toString(36).slice(2));

sessionStorage.setItem("bulletinBoardSessionId", sessionId);

let currentName =
  (localStorage.getItem("bulletinBoardName") || "").trim() || "Guest";

let selectedColor = "yellow";
let notes = {};
const noteElements = new Map();

const nameInput = document.getElementById("nameInput");
const status = document.getElementById("status");
const modal = document.getElementById("noteModal");
const noteTextInput = document.getElementById("noteTextInput");

nameInput.value = currentName === "Guest" ? "" : currentName;

function saveName() {
  const value = nameInput.value.trim().replace(/\s+/g, " ").slice(0, 24);
  currentName = value || "Guest";

  if (currentName === "Guest") {
    localStorage.removeItem("bulletinBoardName");
    nameInput.value = "";
  } else {
    localStorage.setItem("bulletinBoardName", currentName);
    nameInput.value = currentName;
  }
}

document.getElementById("saveName").onclick = saveName;

nameInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    saveName();
    nameInput.blur();
  }
});

document.querySelectorAll(".colorChoice").forEach(button => {
  button.onclick = () => {
    selectedColor = button.dataset.color;
    document.querySelectorAll(".colorChoice").forEach(b => {
      b.style.outline = b === button ? "3px solid #333" : "none";
    });
  };
});

document.getElementById("yellow").click();

function clampPosition(x, y) {
  const w = 190;
  const h = 155;

  return {
    x: Math.max(8, Math.min(x, window.innerWidth - w - 8)),
    y: Math.max(80, Math.min(y, window.innerHeight - h - 8))
  };
}

function findPosition() {
  const existing = Object.values(notes);

  for (let i = 0; i < 150; i++) {
    const p = clampPosition(
      25 + Math.random() * Math.max(30, window.innerWidth - 240),
      95 + Math.random() * Math.max(30, window.innerHeight - 270)
    );

    const overlaps = existing.some(n =>
      Math.abs(p.x - n.x) < 175 &&
      Math.abs(p.y - n.y) < 145
    );

    if (!overlaps) return p;
  }

  return clampPosition(
    window.innerWidth / 2 - 95,
    window.innerHeight / 2 - 70
  );
}

function createNoteElement(id, note) {
  const el = document.createElement("div");

  el.className = "note " + (note.color || "yellow");
  el.style.setProperty("--rotation", (note.rotation || 0) + "deg");

  el.innerHTML = `
    <div class="noteText"></div>
    <div class="noteName"></div>
  `;

  el.querySelector(".noteText").textContent = note.text || "";
  el.querySelector(".noteName").textContent =
    "— " + (note.name || "Guest");

  if (note.owner === sessionId) {
    el.classList.add("mine");
  }

  setupDrag(el, id);

  document.body.appendChild(el);
  noteElements.set(id, el);

  return el;
}

function renderNotes() {
  document.getElementById("empty").style.display =
    Object.keys(notes).length ? "none" : "block";

  for (const id in notes) {
    const note = notes[id];
    let el = noteElements.get(id);

    if (!el) {
      el = createNoteElement(id, note);
    }

    el.style.left = note.x + "px";
    el.style.top = note.y + "px";
    el.style.setProperty("--rotation", (note.rotation || 0) + "deg");

    el.className = "note " + (note.color || "yellow");

    if (note.owner === sessionId) {
      el.classList.add("mine");
    }

    const textEl = el.querySelector(".noteText");
    const nameEl = el.querySelector(".noteName");

    if (textEl) {
      textEl.textContent = note.text || "";
    }

    if (nameEl) {
      nameEl.textContent = "— " + (note.name || "Guest");
    }
  }

  for (const [id, el] of noteElements) {
    if (!notes[id]) {
      el.remove();
      noteElements.delete(id);
    }
  }
}

function setupDrag(el, id) {
  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  el.addEventListener("pointerdown", event => {
    const note = notes[id];
    if (!note) return;

    dragging = true;
    el.style.zIndex = String(10000 + Date.now() % 1000);

    offsetX = event.clientX - note.x;
    offsetY = event.clientY - note.y;

    el.setPointerCapture(event.pointerId);
  });

  el.addEventListener("pointermove", event => {
    if (!dragging) return;

    const note = notes[id];
    if (!note) return;

    const p = clampPosition(
      event.clientX - offsetX,
      event.clientY - offsetY
    );

    el.style.left = p.x + "px";
    el.style.top = p.y + "px";

    note.x = p.x;
    note.y = p.y;
  });

  el.addEventListener("pointerup", async () => {
    if (!dragging) return;

    dragging = false;

    const note = notes[id];
    if (!note) return;

    try {
      await set(ref(db, "bulletinNotes/" + id), { ...note });
    } catch (error) {
      console.error("Failed to save note position:", error);
      status.textContent = "🔴 Failed to save";
    }
  });

  el.addEventListener("pointercancel", () => {
    dragging = false;
  });
}

onValue(ref(db, ".info/connected"), snapshot => {
  status.textContent = snapshot.val()
    ? "🟢 Connected"
    : "🔴 Disconnected";
});

onValue(ref(db, "bulletinNotes"), snapshot => {
  notes = snapshot.val() || {};
  renderNotes();
}, error => {
  console.error("Failed to read bulletin notes:", error);
  status.textContent = "🔴 Database error";
});

document.getElementById("newNote").onclick = () => {
  noteTextInput.value = "";
  modal.style.display = "flex";

  setTimeout(() => noteTextInput.focus(), 30);
};

document.getElementById("cancelNote").onclick = () => {
  modal.style.display = "none";
};

modal.addEventListener("pointerdown", event => {
  if (event.target === modal) {
    modal.style.display = "none";
  }
});

document.getElementById("postNote").onclick = async () => {
  const text = noteTextInput.value.trim();

  if (!text) {
    noteTextInput.focus();
    return;
  }

  const position = findPosition();
  const id = push(ref(db, "bulletinNotes")).key;

  if (!id) {
    status.textContent = "🔴 Could not create note";
    return;
  }

  const note = {
    owner: sessionId,
    name: currentName,
    text: text.slice(0, 500),
    color: selectedColor,
    x: position.x,
    y: position.y,
    rotation: Math.round((Math.random() * 6 - 3) * 10) / 10,
    created: Date.now()
  };

  try {
    await set(ref(db, "bulletinNotes/" + id), note);
    modal.style.display = "none";
  } catch (error) {
    console.error("Failed to post note:", error);
    status.textContent = "🔴 Failed to post note";
  }
};

window.addEventListener("resize", async () => {
  for (const [id, note] of Object.entries(notes)) {
    const p = clampPosition(note.x, note.y);

    if (p.x !== note.x || p.y !== note.y) {
      note.x = p.x;
      note.y = p.y;

      try {
        await set(ref(db, "bulletinNotes/" + id), { ...note });
      } catch (error) {
        console.error("Failed to update note after resize:", error);
      }
    }
  }
});
</script>
</body>
</html>
